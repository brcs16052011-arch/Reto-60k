<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 60K - Registro Oficial</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', sans-serif; 
            background: #2b080c; 
            color: white; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: #4a0e17; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            border: 1px solid #d4af37; 
        }
        h2 { 
            text-align: center; 
            color: #d4af37; 
            text-transform: uppercase; 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #f3e5ab; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #d4af37; 
            background: #2b080c; 
            color: white; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        .talla-section { 
            background: #360a10; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 10px; 
            display: none; 
            border-left: 4px solid #d4af37; 
        }
        button { 
            width: 100%; 
            padding: 18px; 
            background: #d4af37; 
            color: #2b080c; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 25px; 
            font-size: 1.1rem; 
            transition: 0.3s; 
        }
        button:hover { 
            background: #ffd700; 
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        button:disabled { 
            background: #666; 
            color: #ccc;
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro Oficial Reto 60K</h2>
    <form id="registroForm">
        <label>Nombre Completo</label>
        <input type="text" name="nombre" placeholder="Nombre y apellidos" required>

        <label>Grupo Ciclista</label>
        <input type="text" name="grupo_ciclista" placeholder="Nombre de tu equipo" required>

        <label>Lugar de Procedencia</label>
        <input type="text" name="procedencia" placeholder="Ciudad o Estado" required>

        <label>WhatsApp</label>
        <input type="tel" name="whatsapp" placeholder="Ej: +52 1234567890" required>

        <label>Selecciona tu Paquete</label>
        <select name="paquete" id="paqueteSelect" required onchange="actualizarTallas()">
            <option value="">-- Selecciona Paquete --</option>
            <option value="1">Paquete 1 (Jersey)</option>
            <option value="2">Paquete 2 (Rompevientos)</option>
            <option value="3">Paquete 3 (Sin Tallas)</option>
            <option value="4">Paquete 4 (Jersey)</option>
            <option value="5">Paquete 5 (Jersey + Rompevientos)</option>
        </select>

        <div id="seccionJersey" class="talla-section">
            <label>Talla de Jersey (XS a 6XL)</label>
            <select name="talla_jersey" id="talla_jersey"></select>
        </div>

        <div id="seccionRompevientos" class="talla-section">
            <label>Talla de Rompevientos (XS a 6XL)</label>
            <select name="talla_rompevientos" id="talla_rompevientos"></select>
        </div>

        <div id="seccionChaleco" class="talla-section">
            <label>Talla de Chaleco (XS a 6XL)</label>
            <select name="talla_chaleco" id="talla_chaleco"></select>
        </div>

        <label>Foto para FB</label>
        <input type="file" id="f_fb" name="foto_fb" accept="image/*" required>

        <label>Comprobante de Pago</label>
        <input type="file" id="f_pago" name="comprobante" accept="image/*" required>

        <button type="submit" id="btnEnviar">FINALIZAR REGISTRO</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbydqWl7jhtVNYaOQwNUyG0Pa91P2KbOAK8GUeI3gVWoC--6zYFjEg7CmlyooggWq6gq-w/exec';
    
    const tallas = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL", "6XL"];

    function poblarTallas(id) {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="N/A">-- Selecciona Talla --</option>';
        tallas.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t; opt.innerHTML = t;
            select.appendChild(opt);
        });
    }

    poblarTallas('talla_jersey');
    poblarTallas('talla_rompevientos');
    poblarTallas('talla_chaleco');

    function actualizarTallas() {
        const p = document.getElementById('paqueteSelect').value;
        document.getElementById('seccionJersey').style.display = 'none';
        document.getElementById('seccionRompevientos').style.display = 'none';
        document.getElementById('seccionChaleco').style.display = 'none';

        if(p === "1" || p === "4") {
            document.getElementById('seccionJersey').style.display = 'block';
        } else if(p === "2") {
            document.getElementById('seccionRompevientos').style.display = 'block';
        } else if(p === "5") {
            document.getElementById('seccionJersey').style.display = 'block';
            document.getElementById('seccionRompevientos').style.display = 'block';
        }
    }

    // Convertidor de imágenes a texto (Base64) para enviar a Google Drive
    const toBase64 = file => new Promise((resolve) => {
        if (!file) { resolve(""); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve("");
    });

    const form = document.getElementById('registroForm');
    form.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "SUBIENDO REGISTRO Y FOTOS...";

        try {
            const formData = new FormData(form);
            const data = new URLSearchParams();

            // 1. Añadir textos
            for (const pair of formData.entries()) {
                if (!(pair[1] instanceof File)) {
                    data.append(pair[0], pair[1]);
                }
            }

            // 2. Procesar imágenes a Base64 y adjuntarlas
            const img1 = document.getElementById('f_fb').files[0];
            const img2 = document.getElementById('f_pago').files[0];

            data.append("foto_fb_base64", img1 ? await toBase64(img1) : "");
            data.append("comprobante_base64", img2 ? await toBase64(img2) : "");

            // 3. Envío al script de Google
            await fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: data 
            });

            alert("¡REGISTRO EXITOSO!\nDatos y fotografías guardados correctamente.");
            form.reset();
            actualizarTallas();

        } catch (error) {
            alert("Error de conexión al subir imágenes. Intenta usar imágenes menos pesadas.");
        } finally {
            btn.disabled = false;
            btn.innerText = "FINALIZAR REGISTRO";
        }
    });
</script>
</body>
</html>
