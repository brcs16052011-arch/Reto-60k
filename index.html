<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 60K - Registro Oficial</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2b0d19 0%, #15050c 100%); 
            color: #fce4ec; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            align-items: center;
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: #3d1424; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            border: 1px solid #d4af37;
        }
        h2 { 
            text-align: center; 
            color: #ffd700; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-size: 1.6rem;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #f3e5ab; 
            font-size: 0.95rem;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #d4af37; 
            background: #250914; 
            color: #ffffff; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        input[type="file"] {
            background: #250914;
            color: #f3e5ab;
            cursor: pointer;
        }
        input[type="file"]::-webkit-file-upload-button {
            background: #d4af37;
            color: #2b0d19;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
        .talla-section { 
            background: #4a192c; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 12px; 
            display: none; 
            border-left: 4px solid #ffd700; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); 
            color: #1a050d; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 30px; 
            font-size: 1.1rem; 
            letter-spacing: 1px;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #ffd700 0%, #c59b27 100%); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        button:disabled { 
            background: #555555; 
            color: #888888;
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro Oficial Reto 60K</h2>
    <form id="registroForm">
        <label>Nombre Completo</label>
        <input type="text" name="nombre" placeholder="Nombre y apellidos" required>

        <label>Grupo Ciclista</label>
        <input type="text" name="grupo_ciclista" placeholder="Nombre de tu equipo" required>

        <label>Lugar de Procedencia</label>
        <input type="text" name="procedencia" placeholder="Ciudad o Estado" required>

        <label>WhatsApp</label>
        <input type="tel" name="whatsapp" placeholder="Ej: +52 1234567890" required>

        <label>Selecciona tu Paquete</label>
        <select name="paquete" id="paqueteSelect" required onchange="actualizarTallas()">
            <option value="">-- Selecciona Paquete --</option>
            <option value="1">Paquete 1 (Jersey)</option>
            <option value="2">Paquete 2 (Rompevientos)</option>
            <option value="3">Paquete 3 (Sin Tallas)</option>
            <option value="4">Paquete 4 (Jersey)</option>
            <option value="5">Paquete 5 (Jersey + Rompevientos)</option>
        </select>

        <div id="seccionJersey" class="talla-section">
            <label>Talla de Jersey (XS a 6XL)</label>
            <select name="talla_jersey" id="talla_jersey"></select>
        </div>

        <div id="seccionRompevientos" class="talla-section">
            <label>Talla de Rompevientos (XS a 6XL)</label>
            <select name="talla_rompevientos" id="talla_rompevientos"></select>
        </div>

        <label>Foto para FB</label>
        <input type="file" name="foto_fb" id="foto_fb" accept="image/*" required>

        <label>Comprobante de Pago</label>
        <input type="file" name="comprobante" id="comprobante" accept="image/*" required>

        <button type="submit" id="btnEnviar">FINALIZAR REGISTRO</button>
    </form>
</div>

<script>
    // URL de Apps Script actualizada
    const scriptURL = 'Https://script.google.com/macros/s/AKfycby3hJO1_hKlV-9xET57nbillD0FEkNq_P2p6FvN7MXl0BE8EGy6-KxXc51vpeavbT1RfA/exec'; 
    
    const tallas = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL", "6XL"];

    function poblarTallas(id) {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="N/A">-- Selecciona Talla --</option>';
        tallas.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t; 
            opt.innerHTML = t;
            select.appendChild(opt);
        });
    }

    poblarTallas('talla_jersey');
    poblarTallas('talla_rompevientos');

    function actualizarTallas() {
        const p = document.getElementById('paqueteSelect').value;
        document.getElementById('seccionJersey').style.display = 'none';
        document.getElementById('seccionRompevientos').style.display = 'none';

        if(p === "1" || p === "4") {
            document.getElementById('seccionJersey').style.display = 'block';
        } else if(p === "2") {
            document.getElementById('seccionRompevientos').style.display = 'block';
        } else if(p === "5") {
            document.getElementById('seccionJersey').style.display = 'block';
            document.getElementById('seccionRompevientos').style.display = 'block';
        }
    }

    const fileToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
            base64: reader.result,
            type: file.type,
            name: file.name
        });
        reader.onerror = error => reject(error);
    });

    const form = document.getElementById('registroForm');
    form.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "SUBIENDO IMÁGENES Y GUARDANDO...";

        try {
            const fotoFbFile = document.getElementById('foto_fb').files[0];
            const comprobanteFile = document.getElementById('comprobante').files[0];

            let fotoFbData = null;
            let comprobanteData = null;

            if (fotoFbFile) fotoFbData = await fileToBase64(fotoFbFile);
            if (comprobanteFile) comprobanteData = await fileToBase64(comprobanteFile);

            const payload = {
                nombre: form.nombre.value,
                grupo_ciclista: form.grupo_ciclista.value,
                procedencia: form.procedencia.value,
                whatsapp: form.whatsapp.value,
                paquete: form.paquete.value,
                talla_jersey: form.talla_jersey ? form.talla_jersey.value : "N/A",
                talla_rompevientos: form.talla_rompevientos ? form.talla_rompevientos.value : "N/A",
                talla_chaleco: "N/A",
                foto_fb: fotoFbData,
                comprobante: comprobanteData
            };

            const response = await fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.result === "success") {
                alert("¡REGISTRO EXITOSO!\nTus datos e imágenes se guardaron correctamente.");
                form.reset();
                actualizarTallas();
            } else {
                alert("Error al guardar los datos: " + (result.error || "Inténtalo de nuevo."));
            }
        } catch (error) {
            alert("Error al enviar el registro. Verifica tu conexión a internet.");
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerText = "FINALIZAR REGISTRO";
        }
    });
</script>
</body>
</html>
