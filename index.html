<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 60K - Registro Oficial</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', sans-serif; 
            background: #2b080c; /* Guinda muy oscuro para el fondo */
            color: white; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: #4a0e17; /* Guinda principal para la tarjeta */
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            border: 1px solid #d4af37; /* Borde dorado tenue */
        }
        h2 { 
            text-align: center; 
            color: #d4af37; /* Dorado metálico */
            text-transform: uppercase; 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #f3e5ab; /* Dorado claro */
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #d4af37; /* Borde dorado */
            background: #2b080c; /* Fondo oscuro interno */
            color: white; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        .talla-section { 
            background: #360a10; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 10px; 
            display: none; 
            border-left: 4px solid #d4af37; /* Acento dorado lateral */
        }
        button { 
            width: 100%; 
            padding: 18px; 
            background: #d4af37; /* Dorado principal */
            color: #2b080c; /* Texto guinda */
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 25px; 
            font-size: 1.1rem; 
            transition: 0.3s; 
        }
        button:hover { 
            background: #ffd700; /* Dorado brillante */
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        button:disabled { 
            background: #666; 
            color: #ccc;
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro Oficial Reto 60K</h2>
    <form id="registroForm">
        <label>Nombre Completo</label>
        <input type="text" name="nombre" placeholder="Nombre y apellidos" required>

        <label>Grupo Ciclista</label>
        <input type="text" name="grupo_ciclista" placeholder="Nombre de tu equipo" required>

        <label>Lugar de Procedencia</label>
        <input type="text" name="procedencia" placeholder="Ciudad o Estado" required>

        <label>WhatsApp</label>
        <input type="tel" name="whatsapp" placeholder="Ej: +52 1234567890" required>

        <label>Selecciona tu Paquete</label>
        <select name="paquete" id="paqueteSelect" required onchange="actualizarTallas()">
            <option value="">-- Selecciona Paquete --</option>
            <option value="1">Paquete 1 (Jersey)</option>
            <option value="2">Paquete 2 (Rompevientos)</option>
            <option value="3">Paquete 3 (Sin Tallas)</option>
            <option value="4">Paquete 4 (Jersey)</option>
            <option value="5">Paquete 5 (Jersey + Rompevientos)</option>
        </select>

        <div id="seccionJersey" class="talla-section">
            <label>Talla de Jersey (XS a 6XL)</label>
            <select name="talla_jersey" id="talla_jersey"></select>
        </div>

        <div id="seccionRompevientos" class="talla-section">
            <label>Talla de Rompevientos (XS a 6XL)</label>
            <select name="talla_rompevientos" id="talla_rompevientos"></select>
        </div>

        <div id="seccionChaleco" class="talla-section">
            <label>Talla de Chaleco (XS a 6XL)</label>
            <select name="talla_chaleco" id="talla_chaleco"></select>
        </div>

        <label>Foto para FB</label>
        <input type="file" name="foto_fb" accept="image/*" required>

        <label>Comprobante de Pago</label>
        <input type="file" name="comprobante" accept="image/*" required>

        <button type="submit" id="btnEnviar">FINALIZAR REGISTRO</button>
    </form>
</div>

<script>
    // URL Actualizada y autorizada
    const scriptURL = 'https://script.google.com/macros/s/AKfycbydqWl7jhtVNYaOQwNUyG0Pa91P2KbOAK8GUeI3gVWoC--6zYFjEg7CmlyooggWq6gq-w/exec';
    
    const tallas = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL", "6XL"];

    function poblarTallas(id) {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="N/A">-- Selecciona Talla --</option>';
        tallas.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t; opt.innerHTML = t;
            select.appendChild(opt);
        });
    }

    poblarTallas('talla_jersey');
    poblarTallas('talla_rompevientos');
    poblarTallas('talla_chaleco');

    function actualizarTallas() {
        const p = document.getElementById('paqueteSelect').value;
        document.getElementById('seccionJersey').style.display = 'none';
        document.getElementById('seccionRompevientos').style.display = 'none';
        document.getElementById('seccionChaleco').style.display = 'none';

        if(p === "1" || p === "4") {
            document.getElementById('seccionJersey').style.display = 'block';
        } else if(p === "2") {
            document.getElementById('seccionRompevientos').style.display = 'block';
        } else if(p === "5") {
            document.getElementById('seccionJersey').style.display = 'block';
            document.getElementById('seccionRompevientos').style.display = 'block';
        }
    }

    const form = document.getElementById('registroForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "REGISTRANDO...";

        // Creamos los parámetros para el envío de texto
        const formData = new FormData(form);
        const data = new URLSearchParams();
        
        // Solo enviamos los textos (ignora los archivos para que no pese)
        for (const pair of formData) {
            if (!(pair[1] instanceof File)) {
                data.append(pair[0], pair[1]);
            }
        }

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: data 
        })
        .then(() => {
            alert("¡REGISTRO EXITOSO!.");
            form.reset();
            actualizarTallas();
            btn.disabled = false;
            btn.innerText = "FINALIZAR REGISTRO";
        })
        .catch(error => {
            alert("Error de conexión");
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
